services:
  postgres:
    image: postgres:16-alpine
    container_name: job_agent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: job_agent
      POSTGRES_PASSWORD: job_agent_dev_password
      POSTGRES_DB: job_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
